<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>MiCast Go</title><link rel="icon" href="/app/micast-go/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app/micast-go/style.css"><script src="/app/micast-go/qr.js" defer></script><script src="/app/micast-go/app.js" defer></script><script src="/app/micast-go/support.js" defer></script></head>
<body><main>
<header><img src="/app/micast-go/icon.svg" width="32" height="32" alt=""><h1>MiCast Go</h1><span class="version">0.1.3</span><span id="summary" class="muted">音箱投送管理</span><button id="lock" class="quiet icon-button" title="退出管理页登录" aria-label="退出管理页登录" hidden></button></header>
<div id="notice" role="status" aria-live="polite"></div>
<section id="access" class="login-panel" hidden><h2>登录管理页</h2><form id="access-form"><label for="access-key">管理密码</label><div class="row"><input id="access-key" type="password" required autocomplete="current-password"><button>进入</button></div></form></section>
<div id="workspace" hidden>
<section class="account-bar"><span class="status-dot" id="account-dot"></span><strong>米家</strong><span id="account-status" class="muted">读取中</span><div class="toolbar"><button id="login" class="quiet">扫码登录</button><button id="logout" class="text-button account-exit" title="退出米家账号">退出账号</button></div></section>
<section id="qr" hidden><div class="section-heading"><h2>米家扫码登录</h2><div class="toolbar"><button id="refresh-qr" class="quiet">重新获取</button><button id="cancel-qr" class="quiet">收起</button></div></div><img id="qr-image" width="220" height="220" alt="米家登录二维码"><p id="qr-status">等待扫码</p></section>
<section class="route-panel"><div class="section-heading"><h2>音箱 <span id="route-count" class="count"></span></h2><div class="toolbar"><button id="clear-entries" class="quiet" hidden>清空入口</button><button id="diagnostics" class="quiet">导出诊断</button><button id="refresh" class="quiet" title="重新发现音箱">刷新</button></div></div><div id="whole-bar" class="whole-bar"></div><div id="routes"></div></section>
<div class="bottom-grid">
<details class="panel" id="link-panel"><summary>链接播放</summary><form id="play-form"><label>投送入口<select id="play-route"></select></label><div class="field"><label for="audio-url">音频地址</label><div class="row"><input id="audio-url" type="url" placeholder="http://192.168.1.10/music.mp3" required><button>播放</button></div></div></form><p id="command-result" aria-live="polite"></p></details>
<details class="panel"><summary>设置</summary><form id="settings-form" class="settings-grid"><div class="settings-section-title">播放设置</div><label>全屋播放名称<input id="name" maxlength="40" required value="MiCast Go"></label><label>默认格式<select id="format"><option value="mp3">MP3</option><option value="flac">FLAC</option><option value="wav">WAV</option><option value="pcm">PCM</option></select></label><label class="volume-mode-field">手机音量模式<select id="volume-mode"><option value="independent">独立音量</option><option value="linked">联动音量</option></select></label><div id="access-settings" class="access-settings"><div class="settings-section-title">管理访问</div><label><select id="require-login" aria-label="管理访问方式"><option value="off">免密码访问</option><option value="on">密码登录</option></select></label><label id="current-password-label" hidden>当前密码<input id="current-password" type="password" maxlength="128" autocomplete="current-password"></label><label id="new-password-label" hidden>新密码<input id="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="至少 8 位"></label></div><div class="settings-actions"><button type="submit">保存设置</button></div></form></details>
</div>
</div><footer class="support-footer"><details class="panel" id="about-panel"><summary>关于与支持</summary><div class="support-list"><div class="support-actions" role="group" aria-label="联系与赞赏"><button class="quiet" data-support="contact"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/app/micast-go/lucide.svg#mail"></use></svg><span>联系反馈</span></button><button class="quiet" data-support="donate"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/app/micast-go/lucide.svg#heart"></use></svg><span>赞赏开发</span></button></div><nav class="support-legal" aria-label="协议与隐私"><button class="text-button" data-support="user-agreement"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/app/micast-go/lucide.svg#file-text"></use></svg><span>用户协议</span></button><button class="text-button" data-support="privacy-policy"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/app/micast-go/lucide.svg#shield-check"></use></svg><span>隐私政策</span></button></nav></div></details></footer></main><dialog id="support-dialog" aria-labelledby="support-title"><header><h2 id="support-title"></h2><button id="support-close" class="quiet">关闭</button></header><div id="support-body"></div></dialog></body></html>
